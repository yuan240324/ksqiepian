# 提取参数配置示例
#
# 各脚本顶部都有硬编码的常量和 URL。本文件给出一次真实运行的完整参数，
# 供复现与对照。使用时把对应值填回脚本。
#
# ⚠ auth_key 带签名与过期时间，只有几小时有效期，过期必须回第 2 步重取。

# ── 第 1 步：口令 / 短链 ─────────────────────────────────────────
[step1_resolve]
# App 内分享复制出来的原文
share_text      = "##X56ZfKJb622Z1i7##"
# 取出中间 token 拼成短链
short_url       = "https://v.kuaishou.com/f/X56ZfKJb622Z1i7"
# 302 之后落地（subBiz=LIVE_PLAYBACK 表明是直播回放）
final_url       = "https://v.kuaishou.com/fw/playback/1499544558?cc=share_copylink&kpf=ANDROID_PHONE&shareMethod=token&kpn=KUAISHOU&subBiz=LIVE_PLAYBACK&shareId=19115508202223&shareToken=X56ZfKJb622Z1i7&shareMode=app&shareObjectId=5228679375865664634"
playback_id     = "1499544558"

# ── 第 2 步：抓回放页 ────────────────────────────────────────────
[step2_scrape]
# extract_playback.py 顶部 URL 填 final_url
body_file       = "playback_body.html"
body_size       = 147478

# ── 第 3 步：挑选回放 ────────────────────────────────────────────
[step3_pick]
candidates      = 5
# 命名规律：<业务>_<编码><清晰度>L<档>.<13位时间戳>-<时长档>.0-16.m3u8
picked_name     = "JsQSVN0Ra3Q_GameAvcHdL1Lto.1789558283798-5163925.0-16.m3u8"
# 时间戳还原：2026-09-16T11:31:23.798Z = 北京时间 19:31:23
start_utc       = "2026-09-16T11:31:23.798Z"
duration_sec    = 5165
manifest_bytes  = 172045
segment_count   = 1293

# ── 第 4 步：下载分片 ────────────────────────────────────────────
[step4_download]
host            = "alivod.a.yximgs.com"
path            = "/livedvr/flv2ts/gifshow/JsQSVN0Ra3Q_GameAvcHdL1Lto.1789558283798-5163925.0-16.m3u8"
query           = "auth_key=1789826713-1566863167-0-feb9be284f667f5a403520801ef261c7&kpn=KUAISHOU_H5&caller=live-stream-playback-api"
# auth_key 结构：<过期时间戳>-<uid>-<随机>-<md5签名>
auth_key_expire = 1789826713
workers         = 8
outdir          = "G:\\ksrec\\replay\\segs"
first_run_ok    = "1290/1293"
first_run_fail  = "976, 1083, 1148 (HTTP 502)"
second_run_ok   = "1293/1293"
total_mb        = 944.4

# ── 第 5 步：拼接 ────────────────────────────────────────────────
[step5_concat]
method          = "binary-append"
input_glob      = "segs\\*.ts"
output          = "G:\\ksrec\\replay\\merged.ts"
output_bytes    = 990263392
output_mb       = 944.4

# ── 第 6 步：重封装 ──────────────────────────────────────────────
[step6_remux]
tool            = "PyAV 17.1.0"
method          = "packet passthrough (no decode)"
input           = "merged.ts"
output          = "replay_full.mp4"
video_packets   = 154916
audio_packets   = 111235
elapsed_sec     = 8

# ── 第 7 步：验证 ────────────────────────────────────────────────
[step7_verify]
size_mb         = 901.2
container       = "mov/mp4"
duration_sec    = 5165.845326
bit_rate        = 1463461
video           = "h264 1280x960 @30fps yuv420p"
audio           = "aac 44100Hz stereo fltp"
keyframes       = 2637
keyframe_gaps_gt_20s = 0
video_last_pts  = 5165.84
audio_last_pts  = 5165.75
av_drift_tail   = 0.08
audio_frames    = 111235
audio_samples   = 227809280
audio_duration  = 5165.743

# ── 产物 ─────────────────────────────────────────────────────────
[deliverable]
filename        = "快手直播回放_YyXx-828924_20260916.mp4"
bytes           = 945001877
anchor          = "王者荣耀轩妹妹（圆梦主播）  YyXx-828924"
